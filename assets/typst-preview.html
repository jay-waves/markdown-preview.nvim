<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Typst Preview</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  body { margin: 0; }
  iframe { display: block; border: 0; width: 100vw; height: 100vh; }
  #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 6px; background: Canvas; color: CanvasText;
    box-shadow: 0 2px 12px #0003; }
  [hidden] { display: none !important; }
</style>
<div id="status" role="status">Connecting to Neovim…</div>
<iframe id="preview" title="Typst document preview" hidden></iframe>
<script>
(() => {
  const frame = document.getElementById("preview");
  const status = document.getElementById("status");
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || "";
  const endpoint = (path) => `${path}${path.includes("?") ? "&" : "?"}t=${encodeURIComponent(token)}`;
  const channel = "nvim-typst-preview";
  let ended = false, ready = false, connected = false, editorConnected = false;
  let timer, latest, lastLine, syncError = "", restoreVersion = 0;
  const events = new EventSource(endpoint("/__live/events"));

  function scheduleCursor(value) {
    if (ended || (latest && value.seq < latest.seq)) return;
    clearTimeout(timer);
    latest = value;
    if (!value.active || !ready || !connected || !editorConnected) return;
    const key = `${value.bufnr}:${value.row}`;
    if (!value.force && key === lastLine) return;
    timer = setTimeout(async () => {
      try {
        const data = encodeURIComponent(JSON.stringify({ seq: value.seq }));
        const response = await fetch(endpoint(`/__live/event?event=typst-scroll&data=${data}`));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (!ended && latest === value) { lastLine = key; syncError = ""; renderStatus(); }
      } catch (error) {
        if (!ended) { syncError = `Cursor sync failed: ${error.message}`; renderStatus(); }
      }
    }, 300);
  }

  window.addEventListener("message", (event) => {
    if (ended || event.source !== frame.contentWindow || event.origin !== location.origin
      || event.data?.channel !== channel) return;
    const message = event.data;
    if (message.type === "ready") ready = true;
    if (message.type === "connection") {
      connected = message.connected;
      if (!connected) clearTimeout(timer);
    }
    renderStatus();
    if ((message.type === "ready" || message.type === "connection") && latest) scheduleCursor(latest);
  });
  events.addEventListener("cursor", (event) => scheduleCursor(JSON.parse(event.data)));

  function show(text) {
    status.textContent = text;
    status.hidden = false;
  }

  function renderStatus() {
    if (ended) return;
    if (!editorConnected) show("Neovim disconnected. Waiting to reconnect…");
    else if (!ready || !connected) show("Waiting for Tinymist preview…");
    else if (syncError) show(syncError);
    else status.hidden = true;
  }

  function finish() {
    if (ended) return;
    ended = true;
    clearTimeout(timer);
    events.close();
    frame.src = "about:blank";
    frame.hidden = true;
    window.close();
    // Browsers may reject close() for externally opened tabs.
    show("Preview ended. You can close this tab.");
  }

  if (token) {
    frame.src = endpoint("/frame");
    frame.hidden = false;
  } else {
    show("Missing preview session token.");
  }
  events.addEventListener("typst-close", finish);
  // A disconnect alone can also mean a transient failure. Reconnect instead
  // of closing the user's page; only an explicit exit/stop event closes it.
  events.onerror = () => {
    editorConnected = false;
    restoreVersion++;
    clearTimeout(timer);
    renderStatus();
  };
  events.onopen = async () => {
    if (ended) return;
    editorConnected = true;
    const version = ++restoreVersion;
    renderStatus();
    try {
      const response = await fetch(endpoint("/state"));
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const value = await response.json();
      if (!ended && editorConnected && version === restoreVersion) scheduleCursor(value);
    } catch (error) {
      if (!ended && version === restoreVersion) {
        syncError = `Cursor state unavailable: ${error.message}`;
        renderStatus();
      }
    }
  };
  window.addEventListener("pagehide", () => {
    editorConnected = false; restoreVersion++;
    clearTimeout(timer); events.close();
  });
  window.addEventListener("pageshow", (event) => { if (event.persisted && !ended) location.reload(); });
})();
</script>
</html>
