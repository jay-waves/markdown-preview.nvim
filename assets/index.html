<!doctype html>
<html lang="en" data-theme="__THEME__" data-theme-mode="__THEME__" data-bottom-padding="__BOTTOM_PADDING__" data-mermaid-elk="__MERMAID_ELK__" data-live-token="__LIVE_TOKEN__" data-yaml-mode="__YAML_MODE__" data-allow-html="__ALLOW_HTML__" data-click-to-nvim="__CLICK_TO_NVIM__" data-click-port="__CLICK_PORT__">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Preview</title>

    <script>
        // Resolve the system theme before styles are parsed to avoid a flash of
        // the wrong color scheme. data-theme-mode retains the configured mode.
        if (document.documentElement.dataset.themeMode === 'auto') {
            document.documentElement.dataset.theme =
                window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
    </script>

    <!-- KaTeX (LaTeX math rendering) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.css">

    <style>
        /* ── CSS Variables ─────────────────────────────────────────────── */
        :root {
            color-scheme: dark;
            --bg: var(--md-bg, #0d1117);
            --panel: var(--md-kbd-bg, #161b22);
            --stroke: var(--md-border, #30363d);
            --fg: var(--md-fg, #e6edf3);
            --fg-muted: var(--md-muted, #8b949e);
            --link: var(--md-link, #58a6ff);
            --err-bg: rgba(239, 68, 68, .12);
            --err-border: rgba(239, 68, 68, .35);
            --err-fg: var(--md-danger, #fecaca);
            --scroll-track: transparent;
            --scroll-thumb: rgba(148, 163, 184, .35);
            --badge-bg: var(--md-code-bg, rgba(255, 255, 255, .06));
            --badge-fg: var(--md-muted, #8b949e);
            --skeleton: rgba(255, 255, 255, .04);
            --skeleton-shine: rgba(255, 255, 255, .08);
        }

        [data-theme="light"] {
            color-scheme: light;
            --err-bg: rgba(239, 68, 68, .08);
            --err-border: #fecaca;
            --scroll-thumb: rgba(100, 116, 139, .4);
            --skeleton: rgba(0, 0, 0, .04);
            --skeleton-shine: rgba(0, 0, 0, .07);
        }

        /* ── Reset & base ──────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: var(--scroll-thumb) var(--scroll-track);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--stroke);
            color: var(--fg-muted);
            padding: .35rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: .82rem;
            font-weight: 500;
            transition: border-color .15s, background .15s, color .15s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .btn:hover {
            background: rgba(127, 127, 127, .1);
            color: var(--fg);
        }

        /* ── Loading skeleton ─────────────────────────────────────────── */
        .skeleton {
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: var(--skeleton);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-line::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line:nth-child(1) {
            width: 45%;
            height: 28px;
            margin-bottom: 20px;
        }

        .skeleton-line:nth-child(2) {
            width: 90%
        }

        .skeleton-line:nth-child(3) {
            width: 75%
        }

        .skeleton-line:nth-child(4) {
            width: 85%
        }

        .skeleton-line:nth-child(5) {
            width: 60%
        }

        .skeleton-line:nth-child(6) {
            width: 0;
            height: 8px
        }

        .skeleton-line:nth-child(7) {
            width: 35%;
            height: 22px;
            margin-bottom: 16px
        }

        .skeleton-line:nth-child(8) {
            width: 80%
        }

        .skeleton-line:nth-child(9) {
            width: 70%
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%)
            }

            100% {
                transform: translateX(100%)
            }
        }

        /* Non-scrolling wrapper around fenced code: keeps the language badge
           and copy button pinned while the <pre> scrolls horizontally */
        #content .code-wrap {
            position: relative;
            margin: 0 0 1em;
        }

        #content .code-wrap pre {
            margin: 0;
        }

        /* Language badge on code blocks */
        #content .code-wrap .code-lang {
            position: absolute;
            top: 0;
            right: 0;
            padding: .2em .6em;
            font-size: .68rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--badge-fg);
            background: var(--badge-bg);
            border-bottom-left-radius: 6px;
            border-top-right-radius: 7px;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 500;
            line-height: 1.4;
            pointer-events: none;
            z-index: 2;
        }

        /* ── Copy button on code blocks ──────────────────────────────── */
        #content .code-wrap .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s, background .15s;
            color: var(--fg-muted);
            padding: 0;
            z-index: 2;
        }

        #content .code-wrap:hover .copy-btn {
            opacity: 1;
        }

        #content .code-wrap .copy-btn:hover {
            color: var(--fg);
            background: rgba(127, 127, 127, .15);
        }

        #content .code-wrap .copy-btn.copied {
            color: #3fb950;
        }

        /* Shift the button down when a language badge occupies the corner */
        #content .code-wrap .code-lang ~ .copy-btn {
            top: 26px;
        }

        /* ── Front matter panel ───────────────────────────────────────── */
        #fm-panel {
            width: calc(100% - 64px);
            max-width: 916px;
            margin: 32px auto 0;
            border: 1px solid var(--md-border, var(--stroke));
            border-radius: 12px;
            background: var(--md-kbd-bg, var(--panel));
            color: var(--md-fg, var(--fg));
            font-family: var(--md-font-sans, sans-serif);
            font-size: .875rem;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
        }

        #fm-panel > summary {
            display: flex;
            align-items: center;
            gap: .65rem;
            padding: .7rem .9rem;
            cursor: pointer;
            color: var(--md-muted, var(--fg-muted));
            user-select: none;
            list-style: none;
        }

        #fm-panel > summary::-webkit-details-marker {
            display: none;
        }

        #fm-panel > summary::before {
            content: "";
            width: .45rem;
            height: .45rem;
            border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(-45deg);
            transition: transform .15s ease;
            flex: 0 0 auto;
        }

        #fm-panel[open] > summary::before {
            transform: rotate(45deg) translate(-1px, -1px);
        }

        .fm-title {
            color: var(--md-fg, var(--fg));
            font-weight: 600;
        }

        #fm-content {
            padding: .7rem .9rem .9rem;
            border-top: 1px solid var(--md-border, var(--stroke));
            overflow: auto;
        }

        #fm-content .renderjson {
            font: .82rem/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre;
        }

        #fm-content .renderjson a { color: var(--md-link, var(--link)); text-decoration: none }
        #fm-content .renderjson .disclosure { color: var(--md-muted, var(--fg-muted)); cursor: pointer }
        #fm-content .renderjson .key { color: var(--md-fg, var(--fg)) }
        #fm-content .renderjson .string { color: var(--md-alert-tip, #1a7f37) }
        #fm-content .renderjson .number,
        #fm-content .renderjson .boolean { color: var(--md-alert-important, #8250df) }
        #fm-content .renderjson .keyword,
        #fm-content .renderjson .syntax { color: var(--md-muted, var(--fg-muted)) }

        .fm-error {
            margin: 0;
            color: var(--md-danger, var(--err-fg));
            font-size: .8rem;
        }

        @media (max-width: 768px) {
            #fm-panel {
                width: calc(100% - 32px);
                margin-top: 16px;
            }

        }

        /* ── Mermaid diagrams ──────────────────────────────────────────── */
        .mermaid-block {
            position: relative;
            margin: 1em 0;
            border: 1px solid var(--stroke);
            border-radius: 10px;
            background: var(--panel);
            overflow: hidden;
            min-height: 60px;
        }

        .mermaid-block .mermaid-svg-wrap {
            padding: 1rem;
            display: flex;
            justify-content: center;
            overflow: auto;
        }

        .mermaid-block .mermaid-svg-wrap svg {
            max-width: 100%;
            height: auto;
        }

        .mermaid-block .mermaid-expand-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity .2s;
            color: var(--fg-muted);
        }

        .mermaid-block:hover .mermaid-expand-btn {
            opacity: 1
        }

        .mermaid-block .mermaid-expand-btn:hover {
            color: var(--fg);
            background: rgba(127, 127, 127, .1);
        }

        .mermaid-block .mermaid-error {
            padding: .6rem 1rem;
            font-size: .85rem;
            color: var(--err-fg);
            background: var(--err-bg);
            border: 1px solid var(--err-border);
            border-radius: 6px;
            margin: .5rem;
        }

        /* Hide Mermaid's built-in error artifacts (NOT .messageText — used for sequence diagram labels) */
        .mermaid-block :where(.error, .error-icon, .error-text, .errorText) {
            display: none !important
        }

        /* ── Fullscreen overlay (mermaid zoom/pan) ─────────────────────── */
        #overlay {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            background: var(--bg);
            color: var(--fg);
        }

        #overlay[open] {
            display: flex;
            flex-direction: column;
        }

        #overlay::backdrop {
            background: var(--bg);
        }

        #overlay-actions {
            position: absolute;
            z-index: 1;
            top: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: .4rem;
        }

        #overlay-actions .btn {
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
            background: var(--panel);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
        }

        #overlay-panzoom {
            flex: 1;
            overflow: hidden;
        }

        #overlay-panzoom-inner {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #overlay-panzoom-inner svg {
            display: block
        }

        /* ── Misc ──────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            #content {
                padding: 1rem 1rem 3rem
            }
        }
        @media print {
            .mermaid-block .mermaid-svg-wrap svg {
                max-height: 95vh !important;
            }
        }
    </style>
    <style id="markdown-theme">__MARKDOWN_THEME_CSS__</style>
    <style id="highlight-theme">__HIGHLIGHT_THEME_CSS__</style>
</head>

<body>
    <!-- Loading skeleton (replaced by content) -->
    <div id="loadingSkeleton" class="skeleton">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
    </div>

    <details id="fm-panel" style="display:none">
        <summary>
            <span class="fm-title">Front Matter</span>
        </summary>
        <div id="fm-content"></div>
    </details>
    <div id="content" style="display:none"></div>

    <!-- Fullscreen overlay for diagram zoom/pan -->
    <dialog id="overlay" aria-label="Expanded Mermaid diagram">
        <div id="overlay-actions">
            <button id="ovExport" class="btn" title="Export SVG" aria-label="Export SVG">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="ovClose" class="btn" title="Close (Esc)" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div id="overlay-panzoom"><div id="overlay-panzoom-inner"></div></div>
    </dialog>

    <!-- CDN deps: markdown-it, morphdom, highlight.js, emoji, footnote, anchor -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/morphdom@2/dist/morphdom-umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@3.0.0/dist/markdown-it-emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
    <script src="https://unpkg.com/markdown-it-anchor@9.2.0/dist/markdownItAnchor.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.js"></script>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        import markdownItGithubAlerts from 'https://unpkg.com/markdown-it-github-alerts@1.0.1/dist/index.mjs';
        import renderjson from 'https://cdn.jsdelivr.net/npm/renderjson-2@2.0.1/renderjson.mjs';

        const BOTTOM_PADDING = parseFloat(document.documentElement.dataset.bottomPadding) || 0.5;

        // ── DOM refs ──────────────────────────────────────────────────
        const $ = (id) => document.getElementById(id);
        const contentEl = $('content');
        const loadingSkeleton = $('loadingSkeleton');

        // Overlay refs
        const overlay = $('overlay');
        const overlayPanzoom = $('overlay-panzoom');
        const overlayPanzoomInner = $('overlay-panzoom-inner');
        const ovExport = $('ovExport');
        const ovClose = $('ovClose');

        // SVG icons for copy button
        const COPY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2"/></svg>';
        const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        // ── State ─────────────────────────────────────────────────────
        let lastContent = null;
        const systemThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const followsSystemTheme = document.documentElement.dataset.themeMode === 'auto';
        let currentTheme = document.documentElement.dataset.theme || 'dark';
        let mermaidIdCounter = 0;
        const loadedPacks = new Set();

        // Live-reload auth token. Either substituted into the document by
        // markdown-preview.nvim at file-write time, or passed via ?t=<token>
        // in the URL on first load (then stashed in sessionStorage so it
        // survives refreshes). Empty string when the server has no auth.
        const LIVE_TOKEN = (() => {
            const fromAttr = document.documentElement.dataset.liveToken || '';
            // Split literal: a whole '__LIVE_TOKEN__' here would itself be
            // rewritten by write_index's substitution, turning this guard
            // into token !== token and breaking auth on tab reuse (issue #31).
            if (fromAttr && fromAttr !== '__LIVE' + '_TOKEN__') {
                try { sessionStorage.setItem('mdp-token', fromAttr); } catch (_) {}
                return fromAttr;
            }
            const fromUrl = new URLSearchParams(location.search).get('t');
            if (fromUrl) {
                try { sessionStorage.setItem('mdp-token', fromUrl); } catch (_) {}
                return fromUrl;
            }
            try { return sessionStorage.getItem('mdp-token') || ''; } catch (_) { return ''; }
        })();
        const withToken = (url) => {
            if (!LIVE_TOKEN) return url;
            return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(LIVE_TOKEN);
        };
        const CLICK_TO_NVIM = document.documentElement.dataset.clickToNvim === 'true';
        const CLICK_PORT = document.documentElement.dataset.clickPort || '';

        // Scroll sync state
        let scrollSyncPaused = false;
        let scrollSyncPauseTimer = null;
        let lastScrollData = null;

        // Pause scroll sync briefly when user scrolls the browser manually
        function pauseScrollSync() {
            scrollSyncPaused = true;
            clearTimeout(scrollSyncPauseTimer);
            scrollSyncPauseTimer = setTimeout(() => { scrollSyncPaused = false; }, 3000);
        }
        window.addEventListener('wheel', pauseScrollSync, { passive: true });
        window.addEventListener('touchmove', pauseScrollSync, { passive: true });

        // Overlay state
        let ovSvgSource = '';
        let ovPanzoom = null;

        function showContent() {
            if (loadingSkeleton) loadingSkeleton.style.display = 'none';
            contentEl.style.display = '';
        }

        // ── Theme ─────────────────────────────────────────────────────
        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            mermaid.initialize({
                startOnLoad: false,
                theme: theme === 'dark' ? 'dark' : 'default',
                securityLevel: 'strict',
            });
        }

        systemThemeQuery.addEventListener('change', (event) => {
            if (!followsSystemTheme) return;
            applyTheme(event.matches ? 'dark' : 'light');
            renderAllMermaidBlocks(true);
        });

        // ── Markdown-it setup ─────────────────────────────────────────
        if (!window.markdownit) {
            console.error('[markdown-preview] markdown-it not loaded from CDN');
            showContent();
            contentEl.innerHTML = '<p style="color:var(--err-fg)">Failed to load markdown-it from CDN. Check your internet connection.</p>';
        }
        const rawHtmlRequested = document.documentElement.dataset.allowHtml !== 'false';
        const sanitizerAvailable = typeof window.DOMPurify !== 'undefined';
        if (rawHtmlRequested && !sanitizerAvailable) {
            console.error('[markdown-preview] DOMPurify failed to load; raw HTML has been disabled');
        }

        const md = (window.markdownit || function () { return { render: (t) => '<pre>' + t + '</pre>', utils: { escapeHtml: (s) => s } }; })({
            // Raw HTML passthrough is configurable: untrusted markdown can
            // otherwise inject handlers/scripts into this page. Only enable
            // passthrough when DOMPurify is available, so CDN failures fail closed.
            html: rawHtmlRequested && sanitizerAvailable,
            linkify: true,
            typographer: true,
            highlight: function (str, lang) {
                if (lang && lang.toLowerCase() === 'mermaid') {
                    const encoded = encodeURIComponent(str);
                    return `<div class="mermaid-block" data-mermaid-source="${encoded}"><div class="mermaid-svg-wrap"><p style="color:var(--fg-muted);font-size:.85rem">Rendering diagram&hellip;</p></div></div>`;
                }
                if (lang && window.hljs && window.hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="hljs" data-lang="' + md.utils.escapeHtml(lang) + '"><code>' +
                            window.hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                            '</code></pre>';
                    } catch (_) { }
                }
                const langAttr = lang ? ' data-lang="' + md.utils.escapeHtml(lang) + '"' : '';
                return '<pre class="hljs"' + langAttr + '><code>' + md.utils.escapeHtml(str) + '</code></pre>';
            }
        });

        function sanitizeRenderedHtml(html) {
            if (!sanitizerAvailable) return html;
            return window.DOMPurify.sanitize(html, {
                // Preserve common layout HTML and images, KaTeX MathML, and
                // raw SVG used in Markdown, including SVG filter effects.
                USE_PROFILES: {
                    html: true,
                    svg: true,
                    svgFilters: true,
                    mathMl: true,
                },
                ALLOW_DATA_ATTR: true,
            });
        }

        // ── Front matter ──────────────────────────────────────────────
        // Inline block rule; the CDN build of markdown-it-front-matter is
        // CJS-only and never registered in a browser. Captured YAML goes to
        // the #fm-panel <details> (mode "panel") or is dropped ("hide");
        // mode "raw" skips the rule so the text renders as ordinary markdown.
        const YAML_MODE = document.documentElement.dataset.yamlMode || 'panel';
        const YAML_MODULE_URL = 'https://cdn.jsdelivr.net/npm/yaml@2.9.0/+esm';
        let capturedFrontMatter = null;
        let yamlModulePromise = null;
        if (YAML_MODE !== 'raw') {
            md.block.ruler.before('table', 'front_matter', function (state, startLine, endLine, silent) {
                if (startLine !== 0 || state.blkIndent !== 0) return false;
                if (state.src.slice(state.bMarks[0], state.eMarks[0]) !== '---') return false;
                let closed = -1;
                for (let next = startLine + 1; next < endLine; next++) {
                    if (state.tShift[next] > 0) continue;
                    const line = state.src.slice(state.bMarks[next], state.eMarks[next]);
                    if (/^-{3,}\s*$/.test(line)) { closed = next; break; }
                }
                // Unlike upstream, bail out when unclosed: while the fence is
                // still being typed, consuming to EOF would blank the preview.
                if (closed < 0) return false;
                if (silent) return true;
                capturedFrontMatter = state.src.slice(state.bMarks[1], state.bMarks[closed]);
                state.line = closed + 1;
                return true;
            }, { alt: ['paragraph', 'reference', 'blockquote', 'list'] });
        }

        function loadYamlModule() {
            if (!yamlModulePromise) yamlModulePromise = import(YAML_MODULE_URL);
            return yamlModulePromise;
        }

        renderjson.set_show_to_level(1);

        async function updateFrontMatterPanel() {
            const panel = $('fm-panel');
            if (!panel) return;
            if (YAML_MODE === 'panel' && capturedFrontMatter !== null) {
                panel.style.display = '';
                const content = $('fm-content');
                content.replaceChildren();
                const sourceText = capturedFrontMatter;
                try {
                    const { parseDocument } = await loadYamlModule();
                    if (sourceText !== capturedFrontMatter) return;
                    const documentModel = parseDocument(sourceText, { prettyErrors: false });
                    if (documentModel.errors.length > 0) throw documentModel.errors[0];
                    const metadata = documentModel.toJS({ maxAliasCount: 50 });
                    content.replaceChildren(renderjson(metadata));
                } catch (error) {
                    if (sourceText !== capturedFrontMatter) return;
                    const message = document.createElement('p');
                    message.className = 'fm-error';
                    message.textContent = error && error.message
                        ? error.message.split('\n')[0]
                        : 'Unable to parse YAML';
                    content.append(message);
                }
            } else {
                panel.style.display = 'none';
            }
        }

        // Register plugins
        md.use(markdownItGithubAlerts);
        if (window.markdownitEmoji) md.use(window.markdownitEmoji);
        if (window.markdownitFootnote) md.use(window.markdownitFootnote);
        if (window.markdownitTaskLists) md.use(window.markdownitTaskLists, { enabled: false });
        if (window.markdownItAnchor) {
            md.use(window.markdownItAnchor, {
                permalink: false,
                slugify: (s) => s.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, ''),
            });
        }

        // LaTeX math via KaTeX + texmath
        if (window.texmath && window.katex) {
            md.use(window.texmath, {
                engine: window.katex,
                delimiters: ['dollars', 'beg_end'],
            });
        }

        // Line number injection for scroll sync (à la peek.nvim / iamcco)
        function injectLineNumbers(tokens, idx, options, env, slf) {
            if (tokens[idx].map) {
                tokens[idx].attrJoin('class', 'source-line');
                tokens[idx].attrSet('data-source-line', String(tokens[idx].map[0]));
            }
            return slf.renderToken(tokens, idx, options, env, slf);
        }
        md.renderer.rules.paragraph_open = injectLineNumbers;
        md.renderer.rules.heading_open = injectLineNumbers;
        md.renderer.rules.list_item_open = injectLineNumbers;
        md.renderer.rules.table_open = injectLineNumbers;
        md.renderer.rules.blockquote_open = injectLineNumbers;

        // Override fence renderer to handle mermaid specially
        const defaultFence = md.renderer.rules.fence;
        md.renderer.rules.fence = function (tokens, idx, options, env, self) {
            const token = tokens[idx];
            const info = token.info ? token.info.trim().toLowerCase() : '';
            const lineAttr = token.map ? ` data-source-line="${token.map[0]}"` : '';
            if (info === 'mermaid') {
                const encoded = encodeURIComponent(token.content);
                const stableId = 'mmd-' + idx;
                return `<div class="mermaid-block source-line"${lineAttr} id="${stableId}" data-mermaid-source="${encoded}" data-graph="mermaid">` +
                    `<button class="mermaid-expand-btn" title="Expand diagram" data-expand="${stableId}">` +
                    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
                    `</button>` +
                    `<div class="mermaid-svg-wrap"><p style="color:var(--fg-muted);font-size:.85rem">Rendering&hellip;</p></div>` +
                    `</div>`;
            }
            let html;
            if (defaultFence) {
                html = defaultFence(tokens, idx, options, env, self);
            } else {
                html = self.renderToken(tokens, idx, options);
            }
            if (lineAttr) html = html.replace(/^<pre\b/, `<pre${lineAttr}`);
            // Wrap in a non-scrolling container so the language badge and the
            // copy button stay pinned while the <pre> scrolls horizontally.
            // Emitted here rather than in a DOM pass so morphdom's virtual
            // tree matches the live tree and code blocks patch in place.
            const langMatch = html.match(/^<pre[^>]*\bdata-lang="([^"]*)"/);
            const badge = langMatch ? `<span class="code-lang">${langMatch[1]}</span>` : '';
            return `<div class="code-wrap">${badge}${html}` +
                `<button class="copy-btn" title="Copy code">${COPY_ICON}</button></div>`;
        };

        // ── Iconify auto-detection ────────────────────────────────────
        function detectPacks(src) {
            const re = /\b([a-z0-9-]+):[a-z0-9-]+\b/gi;
            const s = new Set();
            let m;
            while ((m = re.exec(src))) s.add(m[1].toLowerCase());
            return [...s];
        }

        async function ensurePack(name) {
            if (loadedPacks.has(name)) return;
            try {
                const loader = () => fetch(`https://unpkg.com/@iconify-json/${name}@1/icons.json`).then(r => r.json());
                await mermaid.registerIconPacks([{ name, loader }]);
                loadedPacks.add(name);
            } catch (_) { }
        }

        // ── Mermaid rendering ─────────────────────────────────────────
        const lastGoodSvg = {};

        function removeMermaidErrorArtifacts(block) {
            block.querySelectorAll('.error,.error-icon,.error-text,.errorText').forEach(node => node.remove());
        }

        async function renderMermaidBlock(block) {
            const source = decodeURIComponent(block.dataset.mermaidSource || '');
            if (!source.trim()) return;

            const wrap = block.querySelector('.mermaid-svg-wrap');
            if (!wrap) return;

            const packs = detectPacks(source);
            for (const p of packs) await ensurePack(p);

            try {
                mermaidIdCounter++;
                const id = 'mmd-render-' + mermaidIdCounter;
                const { svg } = await mermaid.render(id, source);

                wrap.innerHTML = svg;
                block.classList.add('mermaid-rendered');
                block.classList.remove('mermaid-errored');
                lastGoodSvg[block.id] = svg;

                removeMermaidErrorArtifacts(block);
            } catch (e) {
                block.classList.add('mermaid-errored');
                const fallback = lastGoodSvg[block.id];
                if (fallback) {
                    wrap.innerHTML = fallback;
                }
                let errEl = block.querySelector('.mermaid-error');
                if (!errEl) {
                    errEl = document.createElement('div');
                    errEl.className = 'mermaid-error';
                    block.appendChild(errEl);
                }
                const msg = String(e?.message || e || 'Invalid diagram')
                    .split('\n').find(Boolean) || 'Invalid diagram';
                errEl.textContent = msg.replace(/\s*mermaid version\s*\d+(?:\.\d+)*\s*$/i, '').trim();

                removeMermaidErrorArtifacts(block);
            }
        }

        async function renderAllMermaidBlocks(force = false) {
            const selector = '.mermaid-block[data-mermaid-source]' + (force ? '' : ':not(.mermaid-rendered)');
            const blocks = contentEl.querySelectorAll(selector);
            for (const block of blocks) {
                await renderMermaidBlock(block);
            }
        }

        // ── Copy button on code blocks ────────────────────────────────
        // Relative image paths resolve against the served workspace, which
        // only contains the rendered content — rewrite them to the token-
        // gated asset route, which resolves against the source file's dir.
        // Runs on the detached render tree BEFORE morphdom applies it, so
        // raw-HTML <img> tags never fire an unrewritten (404) request.
        let assetPrefix = '';

        async function fetchAssetPrefix() {
            const previous = assetPrefix;
            try {
                const resp = await fetch(withToken('/asset_prefix'), { cache: 'no-store' });
                assetPrefix = resp.ok ? (await resp.text()).trim().replace(/\\/g, '/') : '';
            } catch (_) {
                assetPrefix = '';
            }
            return assetPrefix !== previous;
        }

        function resolveRelativeAssetPath(src, prefix) {
            // A sentinel path preserves evidence that `..` crossed the allowed
            // root. Resolving directly against `/` would clamp excess parents
            // and could silently turn an invalid path into a different file.
            const sentinel = '/__markdown_preview_asset_root__/';
            const encodedPrefix = prefix
                .split('/')
                .filter(Boolean)
                .map(segment => encodeURIComponent(segment))
                .join('/');
            const base = new URL(sentinel + (encodedPrefix ? encodedPrefix + '/' : ''), location.origin);
            const resolved = new URL(src, base);
            if (resolved.origin !== location.origin || !resolved.pathname.startsWith(sentinel)) {
                throw new Error('relative asset path escapes :pwd');
            }

            // URL.pathname intentionally remains percent-encoded. Decode it
            // once into the filesystem spelling; query and fragment are
            // structural URL components and therefore never enter the path.
            return decodeURIComponent(resolved.pathname.slice(sentinel.length));
        }

        function rewriteRelativeImages(rootEl) {
            rootEl.querySelectorAll('img[src]').forEach(img => {
                const src = img.getAttribute('src');
                if (!src || /^(?:[a-zA-Z][a-zA-Z0-9+.-]*:|\/\/|\/|#)/.test(src)) return;
                try {
                    const assetPath = resolveRelativeAssetPath(src, assetPrefix);
                    img.setAttribute('src', withToken('/__live/asset?p=' + encodeURIComponent(assetPath)));
                } catch (error) {
                    console.warn('[markdown-preview] invalid relative image URL:', src, error);
                    img.removeAttribute('src');
                    img.setAttribute('data-invalid-src', src);
                }
            });
        }

        // ── Content sync ──────────────────────────────────────────────
        async function fetchContent() {
            try {
                const resp = await fetch(withToken('content.md?ts=' + Date.now()), { cache: 'no-store' });
                if (!resp.ok) {
                    console.warn('[markdown-preview] content.md fetch failed:', resp.status);
                    if (resp.status === 401) {
                        // Stale token (server restarted since this tab loaded).
                        // Evict it so the next load bootstraps fresh.
                        try { sessionStorage.removeItem('mdp-token'); } catch (_) {}
                    }
                    return null;
                }
                return (await resp.text()).replace(/\r\n?/g, '\n');
            } catch (e) {
                console.warn('[markdown-preview] content.md fetch error:', e);
                return null;
            }
        }

        async function sync(initial = false) {
            const text = await fetchContent();
            if (text == null) {
                return;
            }
            const assetPrefixChanged = await fetchAssetPrefix();
            if (!initial && text === lastContent && !assetPrefixChanged) return;
            lastContent = text;

            try {
                capturedFrontMatter = null;
                const html = sanitizeRenderedHtml(md.render(text));
                await updateFrontMatterPanel();

                showContent();

                if (window.morphdom) {
                    const wrapper = document.createElement('div');
                    wrapper.id = 'content';
                    wrapper.innerHTML = html;
                    rewriteRelativeImages(wrapper);

                    window.morphdom(contentEl, wrapper, {
                        childrenOnly: false,
                        getNodeKey: function (node) {
                            if (node.nodeType === 1) {
                                if (node.getAttribute && node.getAttribute('data-graph') === 'mermaid') {
                                    return node.id;
                                }
                                return node.id || null;
                            }
                            return null;
                        },
                        onBeforeElUpdated: function (fromEl, toEl) {
                            if (fromEl.classList && fromEl.classList.contains('mermaid-rendered') &&
                                fromEl.dataset.mermaidSource === toEl.dataset.mermaidSource) {
                                return false;
                            }
                            if (fromEl.tagName === 'DETAILS' && fromEl.hasAttribute('open')) {
                                toEl.setAttribute('open', '');
                            }
                            return true;
                        },
                    });
                } else {
                    contentEl.innerHTML = html;
                    rewriteRelativeImages(contentEl);
                }
                applyBottomPadding();

                await renderAllMermaidBlocks();
                await applyInitialScroll();

            } catch (e) {
                console.error('[markdown-preview] render error:', e);
                contentEl.innerHTML = '<pre style="white-space:pre-wrap;padding:1rem">' +
                    text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
            }
        }

        // ── Scroll sync (line-based interpolation) ─────────────────────
        function getElementOffset(el) {
            let current = el;
            let top = 0;
            while (top === 0 && current) {
                top = current.getBoundingClientRect().top;
                current = current.parentElement;
            }
            return top + window.scrollY;
        }

        function scrollToSourceLine(line, total) {
            const elements = contentEl.querySelectorAll('[data-source-line]');
            if (!elements.length) return;

            // Edge: first or last line
            if (line <= 0) { window.scrollTo({ top: 0 }); return; }
            if (line >= total - 1) { window.scrollTo({ top: document.documentElement.scrollHeight }); return; }

            // Find element at/before cursor line and the one after
            let prev = null, next = null;
            for (const el of elements) {
                const elLine = Number(el.dataset.sourceLine);
                if (elLine <= line) {
                    prev = { el, line: elLine };
                } else {
                    next = { el, line: elLine };
                    break;
                }
            }

            if (!prev) { window.scrollTo({ top: 0 }); return; }

            const prevTop = getElementOffset(prev.el);
            let offsetTop;

            if (next) {
                const nextTop = getElementOffset(next.el);
                const ratio = (line - prev.line) / (next.line - prev.line);
                offsetTop = prevTop + (nextTop - prevTop) * ratio;
            } else {
                // Last element — extrapolate using its height
                const h = prev.el.getBoundingClientRect().height;
                const linesLeft = Math.max(1, total - prev.line);
                offsetTop = prevTop + (line - prev.line) * (h / linesLeft);
            }

            // Center the target line in the viewport
            window.scrollTo({ top: Math.max(0, offsetTop - window.innerHeight / 2) });
        }

        let lastInitialScrollId = null;

        async function applyInitialScroll() {
            try {
                const resp = await fetch(withToken('/initial_scroll'), { cache: 'no-store' });
                if (!resp.ok) return;
                const text = (await resp.text()).trim();
                if (!text) return;
                const data = JSON.parse(text);
                if (!data.id || data.id === lastInitialScrollId || data.line == null) return;
                lastInitialScrollId = data.id;
                scrollToSourceLine(data.line, data.total || 1);
            } catch (_) {}
        }

        // ── SSE (Server-Sent Events from live-server.nvim) ────────────
        function connectSSE() {
            const evtSource = new EventSource(withToken('/__live/events'));
            evtSource.addEventListener('reload', async () => {
                await sync(false);
            });
            evtSource.addEventListener('scroll', (event) => {
                if (scrollSyncPaused) return;
                try {
                    const data = JSON.parse(event.data);
                    if (data.line == null) return;
                    lastScrollData = data;
                    scrollToSourceLine(data.line, data.total || 1);
                } catch (_) {}
            });
            evtSource.addEventListener('open', () => {
                console.log('[markdown-preview] SSE connected');
            });
            return evtSource;
        }

        // ── Expand overlay (fullscreen diagram zoom/pan) ──────────────
        function openOverlay(svgHtml) {
            ovSvgSource = svgHtml;
            overlayPanzoomInner.innerHTML = svgHtml;
            if (!overlay.open) overlay.showModal();

            const svg = overlayPanzoomInner.querySelector('svg');
            if (svg && window.Panzoom) {
                ovPanzoom = window.Panzoom(svg, {
                    canvas: true,
                    pinchAndPan: true,
                    minScale: 0.1,
                    maxScale: 8,
                });
            } else if (svg) {
                console.error('[markdown-preview] Panzoom failed to load');
            }
        }

        function closeOverlay() {
            if (overlay.open) overlay.close();
        }

        overlay.addEventListener('close', () => {
            if (ovPanzoom) ovPanzoom.destroy();
            ovPanzoom = null;
            overlayPanzoomInner.replaceChildren();
            ovSvgSource = '';
        });

        // Panzoom handles pointer/touch gestures; add wheel zoom explicitly.
        overlayPanzoom.addEventListener('wheel', (e) => {
            if (!ovPanzoom) return;
            e.preventDefault();
            ovPanzoom.zoomWithWheel(e);
        }, { passive: false });

        // Export SVG from overlay
        ovExport.addEventListener('click', () => {
            if (!ovSvgSource) return;
            const blob = new Blob([ovSvgSource], { type: 'image/svg+xml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'diagram.svg';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        });

        // Close overlay
        ovClose.addEventListener('click', closeOverlay);

        // ── Delegated content actions ─────────────────────────────────
        contentEl.addEventListener('click', async (e) => {
            const copyBtn = e.target.closest('.copy-btn');
            if (copyBtn) {
                e.stopPropagation();
                const code = copyBtn.closest('.code-wrap')?.querySelector('code');
                if (!code) return;
                try {
                    await navigator.clipboard.writeText(code.textContent);
                    copyBtn.innerHTML = CHECK_ICON;
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.innerHTML = COPY_ICON;
                        copyBtn.classList.remove('copied');
                    }, 1500);
                } catch (_) {}
                return;
            }

            const expandBtn = e.target.closest('[data-expand]');
            if (expandBtn) {
                const blockId = expandBtn.dataset.expand;
                const block = document.getElementById(blockId);
                if (!block) return;
                const wrap = block.querySelector('.mermaid-svg-wrap');
                if (!wrap) return;
                const svg = wrap.innerHTML;
                if (svg) openOverlay(svg);
                return;
            }

            if (!CLICK_TO_NVIM || !CLICK_PORT) return;
            if (e.target.closest('a, button, input, select, textarea, summary')) return;
            const block = e.target.closest('[data-source-line]');
            if (!block) return;
            const line = Number(block.dataset.sourceLine);
            if (!Number.isInteger(line) || line < 0) return;
            const url = `${location.protocol}//${location.hostname}:${CLICK_PORT}` +
                `/__markdown_preview/click?line=${line}&t=${encodeURIComponent(LIVE_TOKEN)}`;
            fetch(url, { mode: 'no-cors', cache: 'no-store', keepalive: true }).catch(() => {});
        });

        // Re-apply scroll when layout shifts (images loading, etc.)
        new ResizeObserver(() => {
            if (lastScrollData && !scrollSyncPaused) {
                scrollToSourceLine(lastScrollData.line, lastScrollData.total || 1);
            }
        }).observe(contentEl);

        // ── Bottom padding ────────────────────────────────────────────
        function applyBottomPadding() {
            contentEl.style.paddingBottom = `${(1 - BOTTOM_PADDING) * window.innerHeight}px`;
        }
        window.addEventListener('resize', applyBottomPadding);

        // ── Boot ──────────────────────────────────────────────────────
        (async function boot() {
            try {
                if (document.documentElement.dataset.mermaidElk === 'true') {
                    const elkLayouts = await import('https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.2.1/dist/mermaid-layout-elk.esm.min.mjs');
                    mermaid.registerLayoutLoaders(elkLayouts.default || elkLayouts);
                }
                applyTheme(currentTheme);
                await sync(true);
            } catch (e) {
                console.error('[markdown-preview] boot error:', e);
                showContent();
                contentEl.innerHTML = '<p style="color:var(--err-fg)">Error: ' + (e.message || e) + '</p>';
            }
            connectSSE();
        })();
    </script>

    <noscript>
        <p style="padding:1rem;color:#fff;background:#7f1d1d">
            This page requires JavaScript to render Markdown and Mermaid diagrams.
        </p>
    </noscript>
</body>

</html>
